# Exposes CMF externally the same way Kafka/Control Center are exposed -
# an OpenShift Route on the cluster's apps wildcard domain.
#
#   source ../parameters.env && envsubst < cmf-route.yaml | oc apply -f -
#
# termination: passthrough is required (not edge/reencrypt): CMF's
# client-auth is "want" (optional), but a passthrough route is still what
# lets curl/CFK's CMFRestClass present a client cert all the way to the
# CMF pod when they choose to.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: cmf
  namespace: operator
spec:
  host: cmf.${CFLT_OCP_ROUTE_DOMAIN}
  to:
    kind: Service
    name: cmf-service
  port:
    targetPort: cmf-service-https
  tls:
    termination: passthrough
