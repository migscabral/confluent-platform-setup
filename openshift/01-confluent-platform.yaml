# Apply with parameters.env substituted in:
#   source parameters.env && envsubst < 01-confluent-platform.yaml | oc apply -f -
# Prereqs (once): certs/generate-certs.sh, certs/create-secrets.sh
# Resources are demo sizes under podTemplate (the only place CFK reads them); adjust to your workload.
---
apiVersion: platform.confluent.io/v1beta1
kind: KRaftController
metadata:
  name: kraftcontroller
  namespace: confluent
spec:
  dataVolumeCapacity: 10G
  image:
    application: ${CFLT_REGISTRY}/confluentinc/cp-server:${CFLT_CP_VERSION}
    init: ${CFLT_REGISTRY}/confluentinc/confluent-init-container:${CFLT_INIT_VERSION}
    pullPolicy: IfNotPresent
    pullSecretRef:
      - dockerhub-secret
  replicas: 3
  podTemplate:
    podSecurityContext: {}
    resources:
      requests:
        cpu: "500m"
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 4Gi
  # CFK defaults the heap to 100% of requests.memory; the docs recommend at most 80% for KRaft.
  configOverrides:
    jvm:
      - "-Xms1500M"
      - "-Xmx1500M"
  tls:
    secretRef: tls-kraftcontroller
  listeners:
    controller:
      tls:
        enabled: true
      authentication:
        type: mtls
        principalMappingRules:
          - RULE:.*CN[\s]?=[\s]?([a-zA-Z0-9.]*)?.*/$1/
  dependencies:
    metricsClient:
      url: http://controlcenter.confluent.svc.cluster.local:9090
---
apiVersion: platform.confluent.io/v1beta1
kind: Kafka
metadata:
  name: kafka
  namespace: confluent
spec:
  replicas: 3
  image:
    application: ${CFLT_REGISTRY}/confluentinc/cp-server:${CFLT_CP_VERSION}
    init: ${CFLT_REGISTRY}/confluentinc/confluent-init-container:${CFLT_INIT_VERSION}
    pullPolicy: IfNotPresent
    pullSecretRef:
      - dockerhub-secret
  dataVolumeCapacity: 10Gi
  podTemplate:
    podSecurityContext: {}
    resources:
      requests:
        cpu: "1"
        memory: 4Gi
      limits:
        cpu: "4"
        memory: 8Gi
  # CFK defaults the heap to 100% of requests.memory; the docs recommend at most 50% for brokers.
  configOverrides:
    jvm:
      - "-Xms2G"
      - "-Xmx2G"
  tls:
    secretRef: tls-kafka
  listeners:
    # "internal" omitted entirely -> defaults to PLAINTEXT, port 9071
    # (in-cluster only)
    external:
      tls:
        enabled: true
      authentication:
        type: mtls
        principalMappingRules:
          - RULE:.*CN[\s]?=[\s]?([a-zA-Z0-9.]*)?.*/$1/
      externalAccess:
        type: route
        route:
          domain: ${CFLT_OCP_ROUTE_DOMAIN}
  dependencies:
    kRaftController:
      clusterRef:
        name: kraftcontroller
      controllerListener:
        tls:
          enabled: true
        authentication:
          type: mtls
    metricsClient:
      url: http://controlcenter.confluent.svc.cluster.local:9090
---
apiVersion: platform.confluent.io/v1beta1
kind: Connect
metadata:
  name: connect
  namespace: confluent
spec:
  replicas: 1
  podTemplate:
    podSecurityContext: {}
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        cpu: "4"
        memory: 4Gi
  image:
    application: image-registry.openshift-image-registry.svc:5000/confluent/connect-custom:${CFLT_CP_VERSION}-plugins
    init: ${CFLT_REGISTRY}/confluentinc/confluent-init-container:${CFLT_INIT_VERSION}
    # Always: a restarted pod pulls whatever the connect-custom tag currently points to.
    pullPolicy: Always
    # No pullSecretRef: listing one stops the pod from inheriting the default
    # ServiceAccount's internal-registry credentials. dockerhub-secret is linked
    # to that ServiceAccount instead (README step 4).
  mountedSecrets:
    - secretRef: connect-ca
  dependencies:
    kafka:
      bootstrapEndpoint: kafka:9071
---
apiVersion: platform.confluent.io/v1beta1
kind: SchemaRegistry
metadata:
  name: schemaregistry
  namespace: confluent
spec:
  replicas: 1
  tls:
    secretRef: sr-ssl-jks
  podTemplate:
    podSecurityContext: {}
    resources:
      requests:
        cpu: "500m"
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 2Gi
  image:
    application: ${CFLT_REGISTRY}/confluentinc/cp-schema-registry:${CFLT_CP_VERSION}
    init: ${CFLT_REGISTRY}/confluentinc/confluent-init-container:${CFLT_INIT_VERSION}
    pullPolicy: IfNotPresent
    pullSecretRef:
      - dockerhub-secret
  configOverrides:
    server:
      - sni.host.check.enabled=false
  dependencies:
    kafka:
      bootstrapEndpoint: kafka.confluent.svc.cluster.local:9071
  externalAccess:
    type: route
    route:
      domain: ${CFLT_OCP_ROUTE_DOMAIN}
---
apiVersion: platform.confluent.io/v1beta1
kind: ControlCenter
metadata:
  name: controlcenter
  namespace: confluent
spec:
  replicas: 1
  image:
    application: ${CFLT_REGISTRY}/confluentinc/cp-enterprise-control-center-next-gen:${CFLT_C3_VERSION}
    init: ${CFLT_REGISTRY}/confluentinc/confluent-init-container:${CFLT_INIT_VERSION}
    pullPolicy: IfNotPresent
    pullSecretRef:
      - dockerhub-secret
  dataVolumeCapacity: 10Gi
  podTemplate:
    podSecurityContext: {}
    # CFK only reads resources from podTemplate (a top-level spec.resources is silently dropped).
    # The CPU limit also caps the processor count the JVM sees (nodes have many cores),
    # which keeps Jetty's thread requirement under its 200-thread limit.
    resources:
      requests:
        cpu: "1"
        memory: 4Gi
      limits:
        cpu: "4"
        memory: 8Gi
  tls:
    secretRef: tls-controlcenter
  configOverrides:
  #  jvm:
  #    # Explicit fallback in case the container CPU limit is not detected by the JVM.
  #    - -XX:ActiveProcessorCount=4
  #    - -Xms2g
  #    - -Xmx4g
   server:
     - confluent.controlcenter.telemetry.enabled=true
     - confluent.controlcenter.telemetry.collector.enabled=true
     - confluent.controlcenter.telemetry.collector.port=4318
    #  - confluent.controlcenter.streams.num.stream.threads=4
  externalAccess:
    type: route
    route:
      domain: ${CFLT_OCP_ROUTE_DOMAIN}
  dependencies:
    schemaRegistry:
      url: https://schemaregistry.confluent.svc.cluster.local:8081
    connect:
    - name: connect
      url: http://connect.confluent.svc.cluster.local:8083
    kafka:
      bootstrapEndpoint: kafka.confluent.svc.cluster.local:9071
    prometheusClient:
      url: http://controlcenter.confluent.svc.cluster.local:9090
    alertManagerClient:
      url: http://controlcenter.confluent.svc.cluster.local:9093
  services:
    prometheus:
      image: ${CFLT_REGISTRY}/confluentinc/cp-enterprise-prometheus:${CFLT_C3_VERSION}
      pvc:
        dataVolumeCapacity: 10Gi
    alertmanager:
      image: ${CFLT_REGISTRY}/confluentinc/cp-enterprise-alertmanager:${CFLT_C3_VERSION}
---
