# Apply with parameters.env substituted in:
#   source parameters.env && envsubst < 01-confluent-platform.yaml | oc apply -f -
# Prereqs (once): certs/generate-certs.sh, certs/create-secrets.sh
---
apiVersion: platform.confluent.io/v1beta1
kind: KRaftController
metadata:
  name: kraftcontroller
  namespace: confluent
spec:
  dataVolumeCapacity: 10G
  # resources:
  #   requests:
  #     cpu: "1"
  #     memory: 1Gi
  #   limits:
  #     cpu: "1"
  #     memory: 1Gi
  image:
    application: ${CFLT_REGISTRY}/confluentinc/cp-server:${CFLT_CP_VERSION}
    init: ${CFLT_REGISTRY}/confluentinc/confluent-init-container:${CFLT_INIT_VERSION}
    pullPolicy: IfNotPresent
    pullSecretRef:
      - dockerhub-secret
  replicas: 3
  podTemplate:
    podSecurityContext: {}
  tls:
    secretRef: tls-kraftcontroller
  listeners:
    controller:
      tls:
        enabled: true
      authentication:
        type: mtls
        principalMappingRules:
          - RULE:.*CN[\s]?=[\s]?([a-zA-Z0-9.]*)?.*/$1/
  dependencies:
    metricsClient:
      url: http://controlcenter.confluent.svc.cluster.local:9090
---
apiVersion: platform.confluent.io/v1beta1
kind: Kafka
metadata:
  name: kafka
  namespace: confluent
spec:
  replicas: 3
  image:
    application: ${CFLT_REGISTRY}/confluentinc/cp-server:${CFLT_CP_VERSION}
    init: ${CFLT_REGISTRY}/confluentinc/confluent-init-container:${CFLT_INIT_VERSION}
    pullPolicy: IfNotPresent
    pullSecretRef:
      - dockerhub-secret
  dataVolumeCapacity: 10Gi
  # resources:
  #   requests:
  #     cpu: "1"
  #     memory: 1Gi
  #   limits:
  #     cpu: "1"
  #     memory: 1Gi
  podTemplate:
    podSecurityContext: {}
  tls:
    secretRef: tls-kafka
  listeners:
    # "internal" omitted entirely -> defaults to PLAINTEXT, port 9071
    # (in-cluster only)
    external:
      tls:
        enabled: true
      authentication:
        type: mtls
        principalMappingRules:
          - RULE:.*CN[\s]?=[\s]?([a-zA-Z0-9.]*)?.*/$1/
      externalAccess:
        type: route
        route:
          domain: ${CFLT_OCP_ROUTE_DOMAIN}
  dependencies:
    kRaftController:
      clusterRef:
        name: kraftcontroller
      controllerListener:
        tls:
          enabled: true
        authentication:
          type: mtls
    metricsClient:
      url: http://controlcenter.confluent.svc.cluster.local:9090
---
apiVersion: platform.confluent.io/v1beta1
kind: Connect
metadata:
  name: connect
  namespace: confluent
spec:
  replicas: 1
  podTemplate:
    podSecurityContext: {}
  image:
    application: image-registry.openshift-image-registry.svc:5000/confluent/connect-custom:${CFLT_CP_VERSION}-plugins
    init: ${CFLT_REGISTRY}/confluentinc/confluent-init-container:${CFLT_INIT_VERSION}
    pullPolicy: IfNotPresent
    # No pullSecretRef: listing one stops the pod from inheriting the default
    # ServiceAccount's internal-registry credentials. dockerhub-secret is linked
    # to that ServiceAccount instead (README step 4).
  mountedSecrets:
    - secretRef: connect-ca
  dependencies:
    kafka:
      bootstrapEndpoint: kafka:9071
  resources:
    # requests:
    #   cpu: "1"
    #   memory: 1Gi
    # limits:
    #   cpu: "1"
    #   memory: 1Gi
---
apiVersion: platform.confluent.io/v1beta1
kind: SchemaRegistry
metadata:
  name: schemaregistry
  namespace: confluent
spec:
  replicas: 1
  # resources:
  #   requests:
  #     cpu: "1"
  #     memory: 1Gi
  #   limits:
  #     cpu: "1"
  #     memory: 1Gi
  tls:
    secretRef: sr-ssl-jks
  podTemplate:
    podSecurityContext: {}
  image:
    application: ${CFLT_REGISTRY}/confluentinc/cp-schema-registry:${CFLT_CP_VERSION}
    init: ${CFLT_REGISTRY}/confluentinc/confluent-init-container:${CFLT_INIT_VERSION}
    pullPolicy: IfNotPresent
    pullSecretRef:
      - dockerhub-secret
  configOverrides:
    server:
      - sni.host.check.enabled=false
  dependencies:
    kafka:
      bootstrapEndpoint: kafka.confluent.svc.cluster.local:9071
  externalAccess:
    type: route
    route:
      domain: ${CFLT_OCP_ROUTE_DOMAIN}
---
apiVersion: platform.confluent.io/v1beta1
kind: ControlCenter
metadata:
  name: controlcenter
  namespace: confluent
spec:
  replicas: 1
  image:
    application: ${CFLT_REGISTRY}/confluentinc/cp-enterprise-control-center-next-gen:${CFLT_C3_VERSION}
    init: ${CFLT_REGISTRY}/confluentinc/confluent-init-container:${CFLT_INIT_VERSION}
    pullPolicy: IfNotPresent
    pullSecretRef:
      - dockerhub-secret
  dataVolumeCapacity: 10Gi
  # resources:
  #   requests:
  #     cpu: "1"
  #     memory: 1Gi
  #   limits:
  #     cpu: "1"
  #     memory: 1Gi
  podTemplate:
    podSecurityContext: {}
  tls:
    secretRef: tls-controlcenter
  configOverrides:
   server:
     - confluent.controlcenter.telemetry.enabled=true
     - confluent.controlcenter.telemetry.collector.enabled=true
     - confluent.controlcenter.telemetry.collector.port=4318
  externalAccess:
    type: route
    route:
      domain: ${CFLT_OCP_ROUTE_DOMAIN}
  dependencies:
    schemaRegistry:
      url: https://schemaregistry.confluent.svc.cluster.local:8081
    connect:
    - name: connect
      url: http://connect.confluent.svc.cluster.local:8083
    kafka:
      bootstrapEndpoint: kafka.confluent.svc.cluster.local:9071
    prometheusClient:
      url: http://controlcenter.confluent.svc.cluster.local:9090
    alertManagerClient:
      url: http://controlcenter.confluent.svc.cluster.local:9093
  services:
    prometheus:
      image: ${CFLT_REGISTRY}/confluentinc/cp-enterprise-prometheus:${CFLT_C3_VERSION}
      pvc:
        dataVolumeCapacity: 10Gi
    alertmanager:
      image: ${CFLT_REGISTRY}/confluentinc/cp-enterprise-alertmanager:${CFLT_C3_VERSION}
---
